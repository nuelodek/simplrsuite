name: Dependency audit

on:
  pull_request:
  push:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Audit locked Composer dependencies
        run: php composer.phar audit --locked --no-interaction