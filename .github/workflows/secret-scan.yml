name: Secret scanning

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.0
      - name: Scan newly introduced commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PULL_REQUEST_BASE_SHA"
          else
            base_sha="$BEFORE_SHA"
          fi

          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            base_sha="$(git merge-base "$HEAD_SHA" "origin/$DEFAULT_BRANCH")"
          fi

          if [ -z "$base_sha" ]; then
            echo "Could not determine the base commit for the secret scan." >&2
            exit 2
          fi

          "$(go env GOPATH)/bin/gitleaks" git \
            --log-opts="$base_sha..$HEAD_SHA" \
            --redact \
            --no-banner
